    <style>
:root {
  color-scheme: light;
  --bg: #f7faf9;
  --panel: #ffffff;
  --text: #17211d;
  --muted: #64736e;
  --line: #dbe5e1;
  --accent: #08786f;
  --accent-soft: #e2f4f1;
  --blue: #245fdb;
  --blue-soft: #eaf0ff;
  --warn: #a54e00;
  --warn-soft: #fff3df;
  --bad: #b42318;
  --bad-soft: #fff0ee;
  --shadow: 0 16px 38px rgba(24, 41, 34, 0.08);
  font-family: Inter, ui-sans-serif, system-ui, "Segoe UI", Arial, sans-serif;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--text);
}

button,
input,
select,
textarea {
  font: inherit;
}

button {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: 0;
  border-radius: 8px;
  padding: 0 14px;
  background: var(--accent);
  color: white;
  font-weight: 800;
  cursor: pointer;
}

button.secondary {
  border: 1px solid var(--line);
  background: white;
  color: var(--text);
}

button.warn {
  background: var(--warn);
}

button:disabled {
  cursor: not-allowed;
  opacity: 0.55;
}

input,
select,
textarea {
  width: 100%;
  border: 1px solid #c9d5d0;
  border-radius: 8px;
  padding: 11px;
  background: white;
  color: var(--text);
}

textarea {
  min-height: 94px;
  resize: vertical;
}

label {
  display: grid;
  gap: 6px;
  font-size: 13px;
  font-weight: 800;
}

pre {
  max-height: 320px;
  overflow: auto;
  margin: 0;
  border-radius: 8px;
  padding: 12px;
  background: #101915;
  color: #e8f4ee;
  font: 12px/1.45 "Cascadia Mono", Consolas, monospace;
}

.shell {
  min-height: 100vh;
  display: grid;
  grid-template-rows: auto 1fr auto;
}

.top {
  position: sticky;
  top: 0;
  z-index: 2;
  display: grid;
  gap: 12px;
  border-bottom: 1px solid var(--line);
  background: rgba(255, 255, 255, 0.94);
  padding: 14px;
  backdrop-filter: blur(14px);
}

.brand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.brand-lock {
  display: flex;
  align-items: center;
  gap: 10px;
}

.mark {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 10px;
  background: var(--accent);
  color: white;
  font-weight: 900;
}

h1,
h2,
h3,
p {
  margin: 0;
}

h1 {
  font-size: 18px;
}

.small {
  color: var(--muted);
  font-size: 12px;
}

.status {
  display: flex;
  align-items: center;
  gap: 8px;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.dot {
  width: 10px;
  height: 10px;
  border-radius: 999px;
  background: var(--bad);
}

.dot.ok {
  background: var(--accent);
}

.tabs {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 6px;
}

.tabs button {
  min-height: 38px;
  border: 1px solid var(--line);
  background: white;
  color: var(--muted);
  font-size: 12px;
  padding: 0 8px;
}

.tabs button.active {
  border-color: #b9ded8;
  background: var(--accent-soft);
  color: var(--accent);
}

.content {
  display: grid;
  gap: 14px;
  width: min(980px, 100%);
  margin: 0 auto;
  padding: 14px;
}

.panel,
.metric,
.event {
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--panel);
  box-shadow: var(--shadow);
}

.panel {
  display: grid;
  gap: 12px;
  padding: 14px;
}

.panel-head,
.row,
.actions,
.metric-row {
  display: flex;
  align-items: center;
  gap: 9px;
}

.panel-head,
.metric-row {
  justify-content: space-between;
}

.actions {
  flex-wrap: wrap;
}

.grid {
  display: grid;
  gap: 12px;
}

.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

.metrics {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.metric {
  display: grid;
  gap: 5px;
  padding: 12px;
}

.metric span {
  color: var(--muted);
  font-size: 11px;
  font-weight: 900;
  text-transform: uppercase;
}

.metric strong {
  overflow-wrap: anywhere;
  font-size: 22px;
}

.metric.accent {
  background: var(--accent-soft);
}

.metric.blue {
  background: var(--blue-soft);
}

.metric.warn {
  background: var(--warn-soft);
}

.pill {
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 5px 9px;
  background: white;
  color: var(--muted);
  font-size: 12px;
  font-weight: 800;
}

.pill.ok {
  border-color: #b9ded8;
  background: var(--accent-soft);
  color: var(--accent);
}

.pill.bad {
  border-color: #ffd0cb;
  background: var(--bad-soft);
  color: var(--bad);
}

.pill.warn {
  border-color: #ffdca7;
  background: var(--warn-soft);
  color: var(--warn);
}

.mono {
  overflow-wrap: anywhere;
  font-family: "Cascadia Mono", Consolas, monospace;
  font-size: 12px;
}

.event-list {
  display: grid;
  gap: 8px;
}

.event {
  display: grid;
  gap: 4px;
  padding: 10px;
  box-shadow: none;
}

.footer {
  padding: 12px 14px 18px;
  color: var(--muted);
  font-size: 12px;
  text-align: center;
}

.toast {
  position: fixed;
  left: 14px;
  right: 14px;
  bottom: 14px;
  z-index: 4;
  border: 1px solid var(--line);
  border-left: 4px solid var(--accent);
  border-radius: 8px;
  padding: 12px;
  background: white;
  box-shadow: var(--shadow);
}

.toast.bad {
  border-left-color: var(--bad);
}

@media (min-width: 760px) {
  .top {
    grid-template-columns: 1fr auto;
    align-items: center;
  }

  .tabs {
    width: 520px;
  }

  .metrics {
    grid-template-columns: repeat(4, minmax(0, 1fr));
  }
}

@media (max-width: 560px) {
  .two {
    grid-template-columns: 1fr;
  }

  .tabs {
    grid-template-columns: repeat(3, 1fr);
  }
}

    <script>
const BASE_PROTOCOL = 'aqua.base.v0.1';
const MODULE_VERSION = 'v0.1';

function createEvent(type, payload = {}, author = '', parents = []) {
  return normalizeEvent({
    protocol: BASE_PROTOCOL,
    module: String(type).split('.')[0] || 'system',
    moduleVersion: MODULE_VERSION,
    type,
    createdAt: Date.now(),
    author,
    parents,
    payload
  });
}

async function hashEvent(event) {
  return sha256Hex(canonicalJson(signingBody(normalizeEvent(event))));
}

async function signEvent(event, privateKeyBase64) {
  const normalized = normalizeEvent(event);
  const privateKey = await crypto.subtle.importKey('pkcs8', base64ToArrayBuffer(privateKeyBase64), { name: 'Ed25519' }, false, ['sign']);
  const id = await hashEvent(normalized);
  const signature = arrayBufferToBase64(await crypto.subtle.sign({ name: 'Ed25519' }, privateKey, textBytes(canonicalJson(signingBody(normalized)))));
  return { ...normalized, id, signature };
}

async function verifyEventHash(event) {
  if (!event?.id) return false;
  return event.id === await hashEvent(event);
}

async function verifyEventSignature(event, publicKeyBase64 = event?.author) {
  try {
    if (!event?.signature || !publicKeyBase64) return false;
    const publicKey = await crypto.subtle.importKey('spki', base64ToArrayBuffer(publicKeyBase64), { name: 'Ed25519' }, false, ['verify']);
    return crypto.subtle.verify({ name: 'Ed25519' }, publicKey, base64ToArrayBuffer(event.signature), textBytes(canonicalJson(signingBody(normalizeEvent(event)))));
  } catch {
    return false;
  }
}

function normalizeEvent(event) {
  const type = String(event?.type ?? 'system.unknown');
  return {
    protocol: event?.protocol ?? BASE_PROTOCOL,
    module: event?.module ?? type.split('.')[0] ?? 'system',
    moduleVersion: event?.moduleVersion ?? MODULE_VERSION,
    type,
    createdAt: Number(event?.createdAt ?? Date.now()),
    author: String(event?.author ?? ''),
    parents: Array.isArray(event?.parents) ? event.parents.map(String).slice(0, 2) : [],
    payload: event?.payload && typeof event.payload === 'object' && !Array.isArray(event.payload) ? sortValue(event.payload) : {},
    ...(event?.id ? { id: String(event.id) } : {}),
    ...(event?.signature ? { signature: String(event.signature) } : {})
  };
}

function signingBody(event) {
  const normalized = normalizeEvent(event);
  return {
    protocol: normalized.protocol,
    module: normalized.module,
    moduleVersion: normalized.moduleVersion,
    type: normalized.type,
    createdAt: normalized.createdAt,
    author: normalized.author,
    parents: normalized.parents,
    payload: normalized.payload
  };
}

function canonicalJson(value) {
  return JSON.stringify(sortValue(value));
}

function sortValue(value) {
  if (Array.isArray(value)) return value.map(sortValue);
  if (value && typeof value === 'object' && value.constructor === Object) {
    const out = {};
    for (const key of Object.keys(value).sort()) {
      if (value[key] !== undefined) out[key] = sortValue(value[key]);
    }
    return out;
  }
  return value;
}

async function sha256Hex(value) {
  const bytes = typeof value === 'string' ? textBytes(value) : value;
  return [...new Uint8Array(await crypto.subtle.digest('SHA-256', bytes))].map((byte) => byte.toString(16).padStart(2, '0')).join('');
}

async function generateIdentityKeypair() {
  const pair = await crypto.subtle.generateKey({ name: 'Ed25519' }, true, ['sign', 'verify']);
  return {
    publicKey: arrayBufferToBase64(await crypto.subtle.exportKey('spki', pair.publicKey)),
    privateKey: arrayBufferToBase64(await crypto.subtle.exportKey('pkcs8', pair.privateKey))
  };
}

function textBytes(text) {
  return new TextEncoder().encode(String(text));
}

function arrayBufferToBase64(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)));
}

function base64ToArrayBuffer(value) {
  const text = atob(value);
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i);
  return bytes.buffer;
}


const LEVEL_0_EMAIL = 'LEVEL_0_EMAIL';
const LEVEL_1_POHW = 'LEVEL_1_POHW';
const LEVEL_2_FULL = 'LEVEL_2_FULL';
const BETA_OVERRIDE = 'BETAoverride';
const FIRE_RATE = 0.04;

function initialState(options = {}) {
  return {
    now: options.now ?? Date.now(),
    events: [],
    rejected: [],
    identities: new Map(),
    emailIndex: new Map(),
    money: {
      earth: 0,
      sump: 0,
      aqua: new Map(),
      firePaid: new Map(),
      locked: new Map()
    },
    governance: {
      proposals: new Map(),
      votes: new Map(),
      proxies: new Map(),
      committeeOptIn: new Set(),
      committees: new Map()
    },
    dex: {
      quotes: new Map(),
      escrows: new Map(),
      witnesses: new Map(),
      cancels: new Map()
    },
    chat: {
      rooms: new Map(),
      joins: new Map(),
      messages: [],
      credits: new Map()
    }
  };
}

function applyEvent(event, state) {
  const next = state;
  next.events.push(event);
  if (event.module === 'identity') applyIdentity(event, next);
  if (event.module === 'money') applyMoney(event, next);
  if (event.module === 'governance') applyGovernance(event, next);
  if (event.module === 'dex') applyDex(event, next);
  if (event.module === 'chat') applyChat(event, next);
  return next;
}

function replayEvents(events, options = {}) {
  const state = initialState(options);
  for (const event of [...events].sort(compareEvents)) applyEvent(event, state);
  return state;
}

function getIdentity(state, userId) {
  return state.identities.get(userId) ?? {
    userId,
    level: undefined,
    emailHash: undefined,
    betaOverride: undefined,
    isVerified: false,
    betaOverrideActive: false
  };
}

function getAquaBalance(state, userId) {
  return round(state.money.aqua.get(userId) ?? 0);
}

function getGovernanceState(state) {
  return state.governance;
}

function getEscrowState(state) {
  return state.dex.escrows;
}

function isVerifiedIdentity(state, userId) {
  const identity = getIdentity(state, userId);
  return identity.level === LEVEL_1_POHW || identity.level === LEVEL_2_FULL || isActiveBetaOverride(state, userId);
}

function isActiveBetaOverride(state, userId) {
  const identity = state.identities.get(userId);
  return !!identity?.betaOverride && identity.betaOverride.expiresAt > state.now;
}

function tallyProposal(state, proposalId) {
  const tally = {};
  const counted = {};
  const directVotes = state.governance.votes.get(proposalId) ?? new Map();
  const verified = [...state.identities.keys()].filter((userId) => isVerifiedIdentity(state, userId)).sort();

  for (const voter of verified) {
    const direct = directVotes.get(voter);
    if (direct) {
      tally[direct.payload.choice] = (tally[direct.payload.choice] ?? 0) + 1;
      counted[voter] = `direct:${direct.payload.choice}`;
      continue;
    }
    const proxy = state.governance.proxies.get(voter);
    const proxyVote = proxy ? directVotes.get(proxy) : undefined;
    if (proxyVote) {
      tally[proxyVote.payload.choice] = (tally[proxyVote.payload.choice] ?? 0) + 1;
      counted[voter] = `proxy:${proxy}:${proxyVote.payload.choice}`;
    }
  }

  return { proposalId, tally, counted, verifiedHumans: verified.length };
}

function deterministicCommittee(roundId, priorEventHash, eligibleUserIds, count) {
  const seed = `${roundId}|${priorEventHash}|${[...eligibleUserIds].sort().join('|')}`;
  return [...eligibleUserIds]
    .sort((a, b) => simpleHash(`${seed}|${a}`).localeCompare(simpleHash(`${seed}|${b}`)))
    .slice(0, count);
}

function applyIdentity(event, state) {
  let identity = state.identities.get(event.author) ?? { userId: event.author, level: undefined, betaOverrideActive: false, isVerified: false };
  if (event.type === 'identity.email_claim') {
    identity = { ...identity, emailHash: event.payload.emailHash, emailClaimedAt: event.payload.createdAt, level: identity.level ?? LEVEL_0_EMAIL };
    state.emailIndex.set(event.payload.emailHash, event.author);
  }
  if (event.type === 'identity.pohw_simple') {
    identity = { ...identity, emailHash: event.payload.emailHash, pohw: event.payload, level: LEVEL_1_POHW };
  }
  if (event.type === 'identity.beta_override') {
    identity = { ...identity, betaOverride: event.payload, level: identity.level ?? LEVEL_0_EMAIL };
  }
  identity.betaOverrideActive = !!identity.betaOverride && identity.betaOverride.expiresAt > state.now;
  identity.isVerified = identity.level === LEVEL_1_POHW || identity.level === LEVEL_2_FULL || identity.betaOverrideActive;
  state.identities.set(event.author, identity);
}

function applyMoney(event, state) {
  if (event.type === 'money.genesis') state.money.earth = round(event.payload.earthTotal);
  if (event.type === 'money.issue_aqua') {
    if (!event.payload.betaDev) state.money.earth = round(state.money.earth - event.payload.amount);
    add(state.money.aqua, event.payload.to, event.payload.amount);
  }
  if (event.type === 'money.transfer') {
    add(state.money.aqua, event.author, -event.payload.amount);
    add(state.money.aqua, event.payload.to, event.payload.netAmount);
    add(state.money.firePaid, event.author, event.payload.fireAmount);
    state.money.sump = round(state.money.sump + event.payload.fireAmount);
  }
  if (event.type === 'money.sump_distribute') {
    state.money.sump = round(state.money.sump - event.payload.amount);
    add(state.money.aqua, event.payload.to, event.payload.amount);
  }
}

function applyGovernance(event, state) {
  if (event.type === 'governance.proposal_create') state.governance.proposals.set(event.id, event);
  if (event.type === 'governance.vote_cast') {
    if (!state.governance.votes.has(event.payload.proposalId)) state.governance.votes.set(event.payload.proposalId, new Map());
    state.governance.votes.get(event.payload.proposalId).set(event.author, event);
  }
  if (event.type === 'governance.proxy_set') state.governance.proxies.set(event.author, event.payload.proxy);
  if (event.type === 'governance.proxy_revoke') state.governance.proxies.delete(event.author);
  if (event.type === 'governance.committee_opt_in') state.governance.committeeOptIn.add(event.author);
  if (event.type === 'governance.committee_opt_out') state.governance.committeeOptIn.delete(event.author);
  if (event.type === 'governance.committee_select') state.governance.committees.set(event.payload.roundId, event.payload.selected);
}

function applyDex(event, state) {
  if (event.type === 'dex.quote_create') state.dex.quotes.set(event.id, event);
  if (event.type === 'dex.escrow_open') {
    const lockUser = event.payload.lockedFrom ?? event.payload.buyer;
    add(state.money.aqua, lockUser, -event.payload.amount);
    add(state.money.locked, lockUser, event.payload.amount);
    state.dex.escrows.set(event.id, { ...event.payload, id: event.id, lockedFrom: lockUser, witnesses: new Set(), status: 'open' });
  }
  if (event.type === 'dex.witness_attest') {
    if (!state.dex.witnesses.has(event.payload.escrowId)) state.dex.witnesses.set(event.payload.escrowId, new Set());
    state.dex.witnesses.get(event.payload.escrowId).add(event.author);
    const escrow = state.dex.escrows.get(event.payload.escrowId);
    if (escrow) escrow.witnesses.add(event.author);
  }
  if (event.type === 'dex.escrow_release') {
    const escrow = state.dex.escrows.get(event.payload.escrowId);
    if (!escrow) return;
    add(state.money.locked, escrow.lockedFrom, -escrow.amount);
    add(state.money.aqua, event.payload.releaseTo, escrow.amount);
    escrow.status = 'released';
  }
  if (event.type === 'dex.escrow_cancel') {
    if (!state.dex.cancels.has(event.payload.escrowId)) state.dex.cancels.set(event.payload.escrowId, new Set());
    state.dex.cancels.get(event.payload.escrowId).add(event.author);
  }
  if (event.type === 'dex.escrow_refund') {
    const escrow = state.dex.escrows.get(event.payload.escrowId);
    if (!escrow) return;
    add(state.money.locked, escrow.lockedFrom, -escrow.amount);
    add(state.money.aqua, escrow.lockedFrom, escrow.amount);
    escrow.status = 'refunded';
  }
}

function applyChat(event, state) {
  if (event.type === 'chat.room_create') state.chat.rooms.set(event.payload.roomId, event);
  if (event.type === 'chat.room_join') {
    if (!state.chat.joins.has(event.payload.roomId)) state.chat.joins.set(event.payload.roomId, new Set());
    state.chat.joins.get(event.payload.roomId).add(event.author);
  }
  if (event.type === 'chat.message_send') state.chat.messages.push(event);
  if (event.type === 'chat.room_credit_issue') add(roomCredits(state, event.payload.roomId), event.payload.to, event.payload.amount);
  if (event.type === 'chat.room_credit_transfer') {
    const credits = roomCredits(state, event.payload.roomId);
    add(credits, event.author, -event.payload.amount);
    add(credits, event.payload.to, event.payload.amount);
  }
}

function roomCredits(state, roomId) {
  if (!state.chat.credits.has(roomId)) state.chat.credits.set(roomId, new Map());
  return state.chat.credits.get(roomId);
}

function add(map, key, amount) {
  map.set(key, round((map.get(key) ?? 0) + amount));
}

function round(value) {
  return Math.round(Number(value || 0) * 1_000_000) / 1_000_000;
}

function compareEvents(a, b) {
  return a.createdAt - b.createdAt || String(a.id).localeCompare(String(b.id));
}

function simpleHash(value) {
  let out = 2166136261;
  for (let i = 0; i < value.length; i++) {
    out ^= value.charCodeAt(i);
    out = Math.imul(out, 16777619);
  }
  return String(out >>> 0).padStart(10, '0');
}


async function validateEvent(event, state) {
  const normalized = normalizeEvent(event);
  const base = await validateBase(normalized, state);
  if (!base.ok) return base;
  if (normalized.module === 'identity') return validateIdentity(normalized, state);
  if (normalized.module === 'money') return validateMoney(normalized, state);
  if (normalized.module === 'governance') return validateGovernance(normalized, state);
  if (normalized.module === 'dex') return validateDex(normalized, state);
  if (normalized.module === 'chat') return validateChat(normalized, state);
  return fail('unknown-module');
}

async function validateBase(event, state) {
  if (event.protocol !== BASE_PROTOCOL) return fail('unsupported-protocol');
  if (event.moduleVersion !== MODULE_VERSION) return fail('unsupported-module-version');
  if (!['identity', 'money', 'governance', 'dex', 'chat'].includes(event.module)) return fail('unknown-module');
  if (!event.type.startsWith(`${event.module}.`)) return fail('type-module-mismatch');
  if (!Number.isFinite(event.createdAt)) return fail('invalid-created-at');
  if (!event.author) return fail('author-required');
  if (!Array.isArray(event.parents) || event.parents.length > 2) return fail('invalid-parents');
  if (!event.parents.every((id) => state.events.some((prior) => prior.id === id))) return fail('unknown-parent');
  if (!await verifyEventHash(event)) return fail('event-hash-invalid');
  if (!await verifyEventSignature(event, event.author)) return fail('event-signature-invalid');
  return { ok: true };
}

function validateIdentity(event, state) {
  if (event.type === 'identity.email_claim') {
    if (!hex(event.payload.emailHash)) return fail('email-hash-required');
    if (!Number.isFinite(event.payload.createdAt)) return fail('email-created-at-required');
    return { ok: true };
  }
  if (event.type === 'identity.pohw_simple') {
    if (!hex(event.payload.emailHash)) return fail('email-hash-required');
    if (!event.payload.challengeText || !hex(event.payload.responseHash)) return fail('pohw-response-required');
    if (event.payload.method !== 'simple-beta-pohw') return fail('invalid-pohw-method');
    if (!positive(event.payload.score)) return fail('invalid-pohw-score');
    return { ok: true };
  }
  if (event.type === 'identity.beta_override') {
    if (!hex(event.payload.codeHash)) return fail('override-code-hash-required');
    if (event.payload.reason !== 'beta testing only') return fail('invalid-override-reason');
    if (!Number.isFinite(event.payload.expiresAt) || event.payload.expiresAt <= state.now) return fail('override-expired');
    return { ok: true };
  }
  return fail('identity-type-not-allowed');
}

function validateMoney(event, state) {
  if (event.type === 'money.genesis') {
    if (!positive(event.payload.earthTotal)) return fail('invalid-earth-total');
    if (state.events.some((item) => item.type === 'money.genesis')) return fail('duplicate-genesis');
    return { ok: true };
  }
  if (event.type === 'money.issue_aqua') {
    if (!isVerifiedIdentity(state, event.payload.to)) return fail('issue-recipient-not-verified');
    if (!positive(event.payload.amount)) return fail('invalid-issue-amount');
    if (!event.payload.betaDev && state.money.earth < event.payload.amount) return fail('insufficient-earth');
    return { ok: true };
  }
  if (event.type === 'money.transfer') {
    if (event.payload.from && event.payload.from !== event.author) return fail('transfer-from-author-mismatch');
    if (!event.payload.to) return fail('transfer-recipient-required');
    if (!positive(event.payload.amount)) return fail('invalid-transfer-amount');
    const fire = round(event.payload.amount * 0.04);
    if (round(event.payload.fireAmount) !== fire) return fail('invalid-fire-amount');
    if (round(event.payload.netAmount) !== round(event.payload.amount - fire)) return fail('invalid-net-amount');
    if (getAquaBalance(state, event.author) < event.payload.amount) return fail('insufficient-balance');
    return { ok: true };
  }
  if (event.type === 'money.sump_distribute') {
    if (!isVerifiedIdentity(state, event.payload.to)) return fail('sump-recipient-not-verified');
    if (!positive(event.payload.amount)) return fail('invalid-sump-amount');
    if (state.money.sump < event.payload.amount) return fail('insufficient-sump');
    return { ok: true };
  }
  return fail('money-type-not-allowed');
}

function validateGovernance(event, state) {
  if (event.type === 'governance.proposal_create') {
    if (!isVerifiedIdentity(state, event.author)) return fail('proposal-author-not-verified');
    if (!event.payload.title) return fail('proposal-title-required');
    if (!Array.isArray(event.payload.choices) || event.payload.choices.length < 2) return fail('proposal-choices-required');
    return { ok: true };
  }
  if (event.type === 'governance.vote_cast') {
    const proposal = state.governance.proposals.get(event.payload.proposalId);
    if (!isVerifiedIdentity(state, event.author)) return fail('vote-author-not-verified');
    if (!proposal) return fail('proposal-not-found');
    if (!proposal.payload.choices.includes(event.payload.choice)) return fail('invalid-vote-choice');
    return { ok: true };
  }
  if (event.type === 'governance.proxy_set') {
    if (!isVerifiedIdentity(state, event.author)) return fail('proxy-author-not-verified');
    if (!isVerifiedIdentity(state, event.payload.proxy)) return fail('proxy-target-not-verified');
    if (event.payload.proxy === event.author) return fail('self-proxy-not-allowed');
    return { ok: true };
  }
  if (event.type === 'governance.proxy_revoke') {
    if (!isVerifiedIdentity(state, event.author)) return fail('proxy-author-not-verified');
    return { ok: true };
  }
  if (event.type === 'governance.committee_opt_in' || event.type === 'governance.committee_opt_out') {
    if (!isVerifiedIdentity(state, event.author)) return fail('committee-user-not-verified');
    return { ok: true };
  }
  if (event.type === 'governance.committee_select') {
    const eligible = [...state.governance.committeeOptIn].filter((userId) => isVerifiedIdentity(state, userId)).sort();
    const expected = deterministicCommittee(event.payload.roundId, event.payload.priorEventHash, eligible, event.payload.count);
    if (JSON.stringify(event.payload.selected) !== JSON.stringify(expected)) return fail('committee-selection-not-reproducible');
    return { ok: true };
  }
  return fail('governance-type-not-allowed');
}

function validateDex(event, state) {
  if (event.type === 'dex.quote_create') {
    if (!['buy', 'sell'].includes(event.payload.side)) return fail('invalid-quote-side');
    if (!positive(event.payload.amount) || !positive(event.payload.price)) return fail('invalid-quote');
    return { ok: true };
  }
  if (event.type === 'dex.escrow_open') {
    const lockedFrom = event.payload.lockedFrom ?? event.payload.buyer;
    if (!event.payload.buyer || !event.payload.seller) return fail('escrow-parties-required');
    if (!positive(event.payload.amount)) return fail('invalid-escrow-amount');
    if (lockedFrom !== event.author) return fail('escrow-author-must-lock-funds');
    if (getAquaBalance(state, lockedFrom) < event.payload.amount) return fail('insufficient-balance');
    return { ok: true };
  }
  if (event.type === 'dex.witness_attest') {
    const escrow = state.dex.escrows.get(event.payload.escrowId);
    if (!escrow) return fail('escrow-not-found');
    if (!isVerifiedIdentity(state, event.author)) return fail('witness-not-verified');
    if (event.author === escrow.buyer || event.author === escrow.seller) return fail('witness-is-party');
    return { ok: true };
  }
  if (event.type === 'dex.escrow_release') {
    const escrow = state.dex.escrows.get(event.payload.escrowId);
    if (!escrow) return fail('escrow-not-found');
    const threshold = escrow.witnessThreshold ?? 1;
    if (escrow.status !== 'open') return fail('escrow-not-open');
    if ((escrow.witnesses?.size ?? 0) < threshold) return fail('witness-threshold-not-met');
    if (!event.payload.releaseTo) return fail('release-recipient-required');
    return { ok: true };
  }
  if (event.type === 'dex.escrow_cancel') {
    const escrow = state.dex.escrows.get(event.payload.escrowId);
    if (!escrow) return fail('escrow-not-found');
    if (![escrow.buyer, escrow.seller].includes(event.author)) return fail('cancel-author-not-party');
    return { ok: true };
  }
  if (event.type === 'dex.escrow_refund') {
    const escrow = state.dex.escrows.get(event.payload.escrowId);
    if (!escrow) return fail('escrow-not-found');
    const cancels = state.dex.cancels.get(event.payload.escrowId) ?? new Set();
    const timedOut = Number.isFinite(escrow.timeoutAt) && escrow.timeoutAt <= state.now;
    const mutual = cancels.has(escrow.buyer) && cancels.has(escrow.seller);
    if (!timedOut && !mutual) return fail('refund-requires-timeout-or-mutual-cancel');
    return { ok: true };
  }
  return fail('dex-type-not-allowed');
}

function validateChat(event, state) {
  const roomId = event.payload.roomId;
  if (event.type === 'chat.room_create') {
    if (!roomId || !/^[a-z0-9][a-z0-9-]{1,48}$/i.test(roomId)) return fail('invalid-room-id');
    return { ok: true };
  }
  if (event.type === 'chat.room_join') {
    if (!state.chat.rooms.has(roomId)) return fail('room-not-found');
    return { ok: true };
  }
  if (event.type === 'chat.message_send') {
    if (!state.chat.rooms.has(roomId)) return fail('room-not-found');
    if (!event.payload.text) return fail('message-required');
    return { ok: true };
  }
  if (event.type === 'chat.room_credit_issue' || event.type === 'chat.room_credit_transfer') {
    if (!isVerifiedIdentity(state, event.author) && !event.payload.betaDev) return fail('room-credit-author-not-verified');
    if (!positive(event.payload.amount)) return fail('invalid-room-credit-amount');
    if (event.type === 'chat.room_credit_transfer') {
      const balance = state.chat.credits.get(roomId)?.get(event.author) ?? 0;
      if (balance < event.payload.amount) return fail('insufficient-room-credit');
    }
    return { ok: true };
  }
  return fail('chat-type-not-allowed');
}

function positive(value) {
  return typeof value === 'number' && Number.isFinite(value) && value > 0;
}

function hex(value) {
  return typeof value === 'string' && /^[0-9a-f]+$/i.test(value);
}

function fail(reason) {
  return { ok: false, reason };
}

function loadStore() {
  const raw = localStorage.getItem(STORE_KEY) || localStorage.getItem(OLD_STORE_KEY);
  if (!raw) return structuredClone(initialStore);
  const parsed = JSON.parse(raw);
  return {
    ...structuredClone(initialStore),
    ...parsed,
    forms: { ...initialStore.forms, ...(parsed.forms || {}) },
    importSummary: parsed.importSummary || null
  };
}

function saveStore() {
  const safeStore = { ...store, forms: { ...store.forms, betaCode: '' } };
  localStorage.setItem(STORE_KEY, JSON.stringify(safeStore));
  localStorage.setItem('aqua.field.nodeUrl', store.nodeUrl);
  localStorage.setItem('aqua.field.route', store.route);
}

function stateNow() {
  return replayEvents(store.events, { now: Date.now() });
}

function setForm(key, value) {
  store.forms[key] = value;
  saveStore();
}

function setRoute(route) {
  store.route = route;
  saveStore();
  render();
}

function toast(message, bad = false) {
  document.querySelector('.toast')?.remove();
  const node = document.createElement('div');
  node.className = `toast${bad ? ' bad' : ''}`;
  node.textContent = message;
  document.body.append(node);
  setTimeout(() => node.remove(), 3500);
}

async function run(task) {
  try {
    await task();
    store.lastError = '';
    saveStore();
    render();
  } catch (error) {
    store.lastError = String(error.message || error);
    saveStore();
    render();
    toast(store.lastError, true);
  }
}

  document.querySelectorAll('[data-action]').forEach((el) => el.addEventListener('click', () => actions[el.dataset.action]?.()));

    store.nodeUrl = event.target.value.trim();

}

  createAccount: () => run(async () => {
    requireSecureCrypto();
    const email = cleanEmail(store.forms.email);
    const passphrase = store.forms.passphrase;
    if (!email) throw new Error('Enter an email first.');

      encryptedPrivateKey: await encryptText(keypair.privateKey, passphrase),

      createdAt: Date.now()
    };
    await addLocalEvent(await signedEvent('identity.email_claim', {

      createdAt: Date.now()
    }));

async function addLocalEvent(event) {
  const accepted = await validateAndApply([event], { markPending: true });
  if (accepted.accepted !== 1) throw new Error(accepted.reasons[0]?.reason || 'event-rejected');
}

async function validateAndApply(events, options = {}) {
  const summary = { accepted: 0, rejected: 0, reasons: [] };
  const known = new Set(store.events.map((event) => event.id));
  let state = stateNow();
  for (const incoming of events.map(normalizeEvent).sort(compareEvents)) {
    if (known.has(incoming.id)) continue;
    const check = await validateEvent(incoming, state);
    if (!check.ok) {
      summary.rejected += 1;
      summary.reasons.push({ id: incoming.id || short(incoming.type), type: incoming.type, reason: check.reason });
      continue;
    }
    store.events.push(incoming);
    known.add(incoming.id);
    applyEvent(incoming, state);
    if (options.markPending && !store.pending.includes(incoming.id)) store.pending.push(incoming.id);
    summary.accepted += 1;
  }
  store.events.sort(compareEvents);
  store.importSummary = summary;
  saveStore();
  return summary;
}

async function signedEvent(type, payload = {}) {
  requireAccount();
  const privateKey = await unlockPrivateKey();
  return signEvent(createEvent(type, payload, store.account.publicKey, recentParentIds()), privateKey);
}

async function syncNode() {
  if (!store.nodeUrl) throw new Error('Set a node URL first.');
  for (const id of [...store.pending]) {
    const event = store.events.find((item) => item.id === id);
    if (!event) continue;
    const res = await fetch(`${store.nodeUrl}/event`, postBody(event));
    if (res.ok) store.pending = store.pending.filter((item) => item !== id);
    else throw new Error(await res.text());
  }
  await pullNode();
  store.lastSync = new Date().toISOString();
  toast('Synced');
}

async function pullNode() {
  const res = await fetch(`${store.nodeUrl}/events`);
  if (!res.ok) throw new Error(await res.text());
  await importEvents(await res.json(), { markPending: false });
  store.lastSync = new Date().toISOString();
  saveStore();
}

async function importEvents(input, options = {}) {
  const events = Array.isArray(input) ? input : input?.events;
  if (!Array.isArray(events)) throw new Error('Invalid bundle.');
  return validateAndApply(events, options);
}

function bundle() {
  return { app: 'aqua-field-kit', version: '0.1.0-beta', exportedAt: new Date().toISOString(), events: store.events };
}

function exportBundleFile() {
  const blob = new Blob([JSON.stringify(bundle(), null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `aqua-field-${new Date().toISOString().slice(0, 10)}.json`;
  link.click();
  URL.revokeObjectURL(url);
}

function recentParentIds() {
  return store.events.slice().sort(compareEvents).slice(-2).map((event) => event.id);
}

function postBody(body) {
  return { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) };
}

function currentIdentity(state) {
  return store.account ? getIdentity(state, store.account.publicKey) : {};
}

function currentBalance(state) {
  const key = store.account?.publicKey || '';
  return {
    aqua: round(getAquaBalance(state, key)),
    locked: round(state.money.locked.get(key) || 0),
    firePaid: round(state.money.firePaid.get(key) || 0),
    sump: round(state.money.sump),
    earth: round(state.money.earth)
  };
}

function publicAccount(identity) {
  if (!store.account) return {};
  return {
    publicKey: store.account.publicKey,
    emailLocalOnly: store.account.email || undefined,
    level: identityLabel(identity),
    betaOverrideActive: !!identity.betaOverrideActive,
    createdAt: store.account.createdAt
  };
}

function identityLabel(identity) {
  if (!store.account) return 'No account';
  if (identity?.betaOverrideActive) return 'BETA OVERRIDE ACTIVE';
  return identity?.level || 'LEVEL_0_EMAIL';
}

function identityBadge(identity) {
  const label = identityLabel(identity);
  const tone = identity?.betaOverrideActive ? 'warn' : identity?.isVerified ? 'ok' : 'bad';
  return `<span class="pill ${tone}">${escapeHtml(label)}</span>`;
}

function metric(label, value, tone = '') {
  return `<div class="metric ${tone}"><span>${label}</span><strong>${escapeHtml(value)}</strong></div>`;
}

function field(label, key, attrs = '') {
  return `<label>${label}<input data-form="${key}" value="${escapeAttr(store.forms[key] || '')}" ${attrs} /></label>`;
}

function area(label, key) {
  return `<label>${label}<textarea data-form="${key}">${escapeHtml(store.forms[key] || '')}</textarea></label>`;
}

function selectField(label, key, options) {
  return `<label>${label}<select data-form="${key}">${options.map((option) => `<option value="${escapeAttr(option)}"${store.forms[key] === option ? ' selected' : ''}>${escapeHtml(option)}</option>`).join('')}</select></label>`;
}

function eventPanel(title, events) {
  return `<section class="panel"><div class="panel-head"><h2>${title}</h2><span class="pill">${events.length}</span></div>${eventList(events)}</section>`;
}

function eventList(events) {
  if (!events.length) return '<p class="small">No events yet.</p>';
  return `<div class="event-list">${events.map((event) => `
    <article class="event">
      <strong>${escapeHtml(event.type)}</strong>
      <span class="small">${escapeHtml(event.module)} | ${new Date(event.createdAt).toLocaleString()}</span>
      <span class="mono">${escapeHtml(short(event.id))}</span>
    </article>
  `).join('')}</div>`;
}

function messagePanel(events) {
  return `<section class="panel"><div class="panel-head"><h2>Messages</h2><span class="pill">${events.length}</span></div>${events.length ? events.slice(-8).map((event) => `<article class="event"><strong>${escapeHtml(short(event.author))}</strong><span>${escapeHtml(event.payload.text)}</span></article>`).join('') : '<p class="small">No messages yet.</p>'}</section>`;
}

function printableEscrow(escrow) {
  return { ...escrow, witnesses: [...(escrow.witnesses || [])] };
}

function amountFrom(key) {
  const value = Number(store.forms[key]);
  if (!Number.isFinite(value) || value <= 0) throw new Error('Enter a positive amount.');
  return round(value);
}

function cleanEmail(value) {
  return String(value || '').trim().toLowerCase();
}

async function hashLocal(value) {
  return sha256Hex(textBytes(value));
}

// TEMPORARY BETA ONLY - REMOVE BEFORE PRODUCTION
function isValidBetaOverride(input) {
  return String(input || '') === BETA_OVERRIDE;
}

function requireAccount() {
  if (!store.account?.publicKey) throw new Error('Create an account first.');
}

function requireSecureCrypto() {
  if (!crypto?.subtle) throw new Error('Web Crypto is unavailable. Serve this app over HTTPS or localhost.');
}

async function unlockPrivateKey() {
  requireAccount();
  if (!store.forms.passphrase) throw new Error('Enter your passphrase to sign.');
  return decryptText(store.account.encryptedPrivateKey, store.forms.passphrase);
}

async function encryptText(text, passphrase) {
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await passphraseKey(passphrase, salt);
  const cipher = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, textBytes(text));
  return { salt: arrayBufferToBase64(salt), iv: arrayBufferToBase64(iv), cipher: arrayBufferToBase64(cipher) };
}

async function decryptText(blob, passphrase) {
  const salt = new Uint8Array(base64ToArrayBuffer(blob.salt));
  const iv = new Uint8Array(base64ToArrayBuffer(blob.iv));
  const key = await passphraseKey(passphrase, salt);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, base64ToArrayBuffer(blob.cipher));
  return new TextDecoder().decode(plain);
}

async function passphraseKey(passphrase, salt) {
  const baseKey = await crypto.subtle.importKey('raw', textBytes(passphrase), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 210_000, hash: 'SHA-256' }, baseKey, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}

function arrayBufferToBase64(buffer) {
  return btoa(String.fromCharCode(...new Uint8Array(buffer)));
}

function base64ToArrayBuffer(value) {
  const text = atob(value);
  const bytes = new Uint8Array(text.length);
  for (let i = 0; i < text.length; i++) bytes[i] = text.charCodeAt(i);
  return bytes.buffer;
}

function short(value) {
  if (!value) return '-';
  return value.length > 18 ? `${value.slice(0, 10)}...${value.slice(-6)}` : value;
}

function escapeHtml(value) {
  return String(value).replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;').replaceAll('"', '&quot;').replaceAll("'", '&#039;');
}

function escapeAttr(value) {
  return escapeHtml(value).replaceAll('\n', '&#10;');
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

render();
